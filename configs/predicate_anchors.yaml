# Anchor-синсеты RuWordNet для предкомпиляции словаря predicate-классов.
#
# Каждая запись — корневой класс семантической иерархии глаголов.
# `seed_lemma` разрешается в synset_id через ruwordnet API, итоговый
# `resolved_synset_id` фиксируется здесь же для воспроизводимости.
# `expected_hyponyms` — наблюдаемое число hyponyms первого уровня
# (контрольное значение, помогает заметить дрейф RuWordNet).
# `priority` — порядок обхода якорей в build-скрипте (меньше = раньше).
# Узкие/специфичные классы (perception, creation) обрабатываются первыми
# и резервируют свои synset-ы; более широкие (emotion, causation) идут
# последними — их BFS пропускает уже занятые synset-ы вместе с
# поддеревьями. Это решает cross-root коллизии, когда один synset
# RuWordNet оказывается и в perception, и в emotion (через цепочку
# "пережить → ощущать → воспринимать → слышать").
#
# Используется скриптом scripts/build_predicate_lexicon.py — он
# делает BFS hyponyms от каждого anchor до max_depth и собирает
# lemma → [leaf, mid, root] в configs/predicate_classes_ruwordnet.yaml.
#
# Принципы выбора якорей:
#   - Покрывают 8 классов исходного configs/predicate_classes.yaml
#     (motion / communication / cognition / perception / possession /
#     creation / change_of_state / causation) плюс 4 расширения
#     (emotion, volition, existence, physical_action).
#   - Деревья якорей пересекаются по hyponym-связям RuWordNet
#     (323 cross-root коллизии при наивном BFS). Конфликты разрешаются
#     overlap-prune по приоритету (см. поле `priority`).
#   - Для маленьких корней (cognition, volition, existence)
#     достаточно глубины BFS — на depth=3 они покрывают значимый
#     объём лемм через средний уровень.

version: 1
anchors:
  perception:
    seed_lemma: "воспринимать"
    label_ru: "ощущать, воспринимать"
    resolved_synset_id: "106915-V"
    expected_hyponyms: 15
    priority: 10

  cognition:
    seed_lemma: "мыслить"
    label_ru: "мыслительный процесс"
    resolved_synset_id: "106467-V"
    expected_hyponyms: 6
    priority: 20

  volition:
    seed_lemma: "хотеть"
    label_ru: "хотеть, иметь желание"
    resolved_synset_id: "119928-V"
    expected_hyponyms: 6
    priority: 30

  communication:
    seed_lemma: "высказать"
    label_ru: "речевая деятельность, высказывание"
    resolved_synset_id: "106876-V"
    expected_hyponyms: 29
    priority: 40

  possession:
    seed_lemma: "иметь"
    label_ru: "располагать, иметь в распоряжении"
    resolved_synset_id: "149549-V"
    expected_hyponyms: 10
    priority: 50

  motion:
    seed_lemma: "перемещаться"
    label_ru: "движение, перемещение"
    resolved_synset_id: "106587-V"
    expected_hyponyms: 71
    priority: 60

  physical_action:
    seed_lemma: "ударить"
    label_ru: "ударить, нанести физическое воздействие"
    resolved_synset_id: "107404-V"
    expected_hyponyms: 34
    priority: 70

  creation:
    seed_lemma: "создать"
    label_ru: "создать, сделать существующим"
    resolved_synset_id: "106493-V"
    expected_hyponyms: 28
    priority: 80

  change_of_state:
    seed_lemma: "изменяться"
    label_ru: "изменение состояния"
    resolved_synset_id: "106629-V"
    expected_hyponyms: 75
    priority: 90

  existence:
    seed_lemma: "существовать"
    label_ru: "существовать, быть, иметься"
    resolved_synset_id: "106947-V"
    expected_hyponyms: 8
    priority: 100

  emotion:
    seed_lemma: "переживать"
    label_ru: "пережить, испытать (эмоцию, состояние)"
    resolved_synset_id: "116921-V"
    expected_hyponyms: 52
    priority: 110

  causation:
    seed_lemma: "обусловливать"
    label_ru: "обусловливать, способствовать"
    resolved_synset_id: "106473-V"
    expected_hyponyms: 15
    priority: 120
