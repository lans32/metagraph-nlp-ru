# Маппинг deprel: SynTagRus (russian.mco от Sharoff & Nivre, CoNLL-X) → UD.
# Используется, чтобы пайплайн, написанный на UD-роли (nsubj/obj/obl/root/...),
# мог работать с pre-trained моделью на старой схеме зависимостей SynTagRus.
# Подключается через morphsyntax.malt_deprel_mapping в configs/malt_treetagger.yaml.

# --- Корень и пунктуация ---
ROOT: root
PUNC: punct

# --- Ядерные актанты ---
предик: nsubj           # подлежащее
1-компл: obj            # прямое дополнение
2-компл: iobj           # косвенное дополнение
3-компл: obl
4-компл: obl
5-компл: obl
агент: obl              # агенс в пассивных конструкциях
квазиагент: obl
неоп-агент: obl
неакт-компл: obl

# --- Предложные группы ---
предл: obl              # предложно-падежная группа

# --- Связка / составное сказуемое ---
присвяз: cop            # связка при именном сказуемом
аналит: aux             # аналитическая форма
вспом: aux
пасс-анал: aux:pass

# --- Атрибутивные / именные модификаторы ---
атриб: amod
опред: amod
оп-опред: amod
релят: nmod
оп-релят: nmod
аппоз: appos
оп-аппоз: appos
разъяснит: appos        # уточнение/пояснение

# --- Обстоятельства ---
обст: advmod
наречн: advmod
огранич: advmod         # ограничительное определение
изъясн: ccomp           # изъяснительное (подчинённая клауза)
обст-тавт: advmod
длительн: advmod
суб-обст: advmod
кратн: nummod
количест: nummod

# --- Сочинение ---
сочин: conj
соч-союзн: cc
соч-сочин: conj
сент-соч: conj          # сочинение на уровне предложения

# --- Подчинение / связки клауз ---
подч-союзн: mark
инф-союзн: mark
сравн-союзн: mark
сравнит: advcl
сент-предик: ccomp
сент-агент: csubj
сент-объект: ccomp
инфинит: xcomp

# --- Прочее ---
эксплет: expl
эллипт: dep
композ: compound
сочинит: cc
