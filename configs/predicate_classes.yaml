# Словарь семантических классов предикатов (CLAUDE.md §5.5).
# Ручная разметка v0: ~80 русских лемм по 8 базовым классам.
# Источники: классы Вендлера (state/activity/achievement/accomplishment)
# плюс семантические поля (motion, communication, ...).
#
# Формат:
#   classes:
#     <class_name>: [<lemma>, ...]
#
# Леммы — словарная форма (инфинитив) глагола. Одна лемма может
# встречаться в нескольких классах.
#
# Расширяется вручную. Любая лемма, не попавшая в словарь,
# не получает predicate_class и не участвует в predicate_class_cluster_v0.

version: 0
classes:
  motion:
