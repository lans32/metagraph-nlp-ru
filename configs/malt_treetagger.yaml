# Конфиг для backend'а MaltParser + TreeTagger.
# Пути приведены под локальную раскладку проекта (TreeTagger/ и maltparser/
# в корне). При необходимости — заменить на абсолютные.

paths:
  data_dir: data
  artifacts_dir: artifacts

segmentation:
  sentence_splitter: razdel

morphsyntax:
  parser: maltparser
  # TreeTagger (морфо) — macOS arm64 binary
  tree_tagger_bin: TreeTagger/bin/tree-tagger
  tree_tagger_param: TreeTagger/lib/russian.par
  tree_tagger_tagset: msd_ru
  # MaltParser (синтаксис)
  malt_jar: maltparser/maltparser-1.9.2.jar
  # Используется pre-trained russian.mco (Sharoff & Nivre, CoNLL-X формат).
  # Если хочется UD-native — обучить ru_syntagrus.mco по инструкции в README.
  malt_model: maltparser/russian.mco
  java_bin: /opt/homebrew/opt/openjdk@17/bin/java
  # russian.mco даёт SynTagRus-deprels — мапим в UD, иначе clauses/graph не работают
  malt_deprel_mapping: configs/malt_deprel_syntagrus_to_ud.yaml
  workers: 1
  parallel_threshold: 16

clauses:
  strategy: ud_subtree_clauses_v0

graph:
  builder: ud_roles_v0

anaphora:
  enabled: false

aggregation:
  linguistic_enabled: true
  shared_entity_enabled: true
  paragraph_enabled: true
  entity_cluster_enabled: true
  predicate_class_cluster_enabled: true
  topic_overlap_enabled: true

log_level: INFO
